name: Secret scan

# Runs on GitHub for every push and pull request, even if someone skipped the local check.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so old commits are checked too

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: KaupBudget secret check
        run: python tools/check_secrets.py --all

      - name: Gitleaks (broad secret scanner)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --redact --verbose
